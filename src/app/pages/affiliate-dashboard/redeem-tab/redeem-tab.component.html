<div class="space-y-6">
  <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
    <h3 class="text-sm font-bold uppercase tracking-widest text-slate-400">Redeemable Cards</h3>
    <p class="mt-2 text-sm text-slate-500">Redeem points with available cards.</p>
    <p class="mt-2 text-sm font-bold text-slate-700" *ngIf="points$ | async as points">Available: {{ points | number }} pts</p>

    <p *ngIf="resultMessage"
      class="mt-4 rounded-xl px-3 py-2 text-sm font-medium"
      [ngClass]="resultOk ? 'bg-emerald-50 text-emerald-700' : 'bg-amber-50 text-amber-700'">
      {{ resultMessage }}
    </p>
  </div>

  <div class="grid gap-4 sm:grid-cols-2" *ngIf="points$ | async as points">
    <div *ngFor="let card of redeemCards" class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
      <div class="rounded-xl bg-gradient-to-r p-4 text-white" [ngClass]="card.gradientClass">
        <p class="text-xs font-bold uppercase tracking-widest text-white/80">Redeem Card</p>
        <p class="mt-2 text-2xl font-black">Rs {{ card.valueLkr | number }}</p>
      </div>

      <div class="mt-4 flex items-center justify-between">
        <p class="text-sm font-semibold text-slate-600">Required points</p>
        <p class="text-sm font-black text-slate-900">{{ card.pointsRequired | number }}</p>
      </div>

      <button (click)="redeem(card)"
        [disabled]="points < card.pointsRequired"
        class="mt-4 w-full rounded-xl px-4 py-2.5 text-sm font-bold transition"
        [ngClass]="points >= card.pointsRequired
          ? 'bg-primary text-white hover:bg-primary/90'
          : 'cursor-not-allowed bg-slate-200 text-slate-500'">
        {{ points >= card.pointsRequired ? 'Redeem Now' : 'Not Enough Points' }}
      </button>
    </div>
  </div>
</div>
