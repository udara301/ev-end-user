<div class="space-y-5">
  <!-- Header -->
  <div class="flex items-center gap-3">
    <button (click)="goBack()"
      class="flex h-10 w-10 items-center justify-center rounded-xl border border-slate-200 bg-white shadow-sm transition hover:bg-slate-50">
      <span class="material-icons text-lg text-slate-600">arrow_back</span>
    </button>
    <div>
      <h2 class="text-lg font-bold text-slate-900 lg:text-xl">Change Password</h2>
      <p class="text-xs text-slate-500">Update your login credentials</p>
    </div>
  </div>

  <!-- Alerts -->
  <div *ngIf="successMessage"
    class="flex items-center gap-2 rounded-xl bg-emerald-50 border border-emerald-200 p-3 text-sm font-medium text-emerald-700">
    <span class="material-icons text-base">check_circle</span>
    {{ successMessage }}
  </div>
  <div *ngIf="errorMessage"
    class="flex items-center gap-2 rounded-xl bg-red-50 border border-red-200 p-3 text-sm font-medium text-red-600">
    <span class="material-icons text-base">error</span>
    {{ errorMessage }}
  </div>

  <!-- Form -->
  <form (ngSubmit)="onSubmit()" class="space-y-5">
    <div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm lg:p-5 space-y-4">
      <label class="text-xs font-bold uppercase tracking-widest text-slate-400 mb-4 block">Change Password</label>
      <!-- Current Password -->
      <div>
        <label for="current_password" class="block text-xs font-medium text-slate-500 mb-1">Current Password</label>
        <input id="current_password" type="password" [(ngModel)]="form.current_password" name="current_password" required
          class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-2.5 text-sm text-slate-900 placeholder-slate-400 focus:border-primary focus:bg-white focus:outline-none focus:ring-1 focus:ring-primary"
          placeholder="Enter current password" />
      </div>
      <!-- New Password -->
      <div>
        <label for="new_password" class="block text-xs font-medium text-slate-500 mb-1">New Password</label>
        <input id="new_password" type="password" [(ngModel)]="form.new_password" name="new_password" required minlength="6"
          class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-2.5 text-sm text-slate-900 placeholder-slate-400 focus:border-primary focus:bg-white focus:outline-none focus:ring-1 focus:ring-primary"
          placeholder="Enter new password" />
      </div>
      <!-- Confirm Password -->
      <div>
        <label for="confirm_password" class="block text-xs font-medium text-slate-500 mb-1">Confirm New Password</label>
        <input id="confirm_password" type="password" [(ngModel)]="form.confirm_password" name="confirm_password" required minlength="6"
          class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-2.5 text-sm text-slate-900 placeholder-slate-400 focus:border-primary focus:bg-white focus:outline-none focus:ring-1 focus:ring-primary"
          placeholder="Confirm new password" />
      </div>
    </div>
    <!-- Submit -->
    <button type="submit" [disabled]="isSaving"
      class="flex w-full items-center justify-center gap-2 rounded-2xl bg-primary py-3.5 text-sm font-bold text-white shadow-lg transition hover:bg-primary/90 disabled:opacity-50 lg:w-auto lg:px-8">
      <span *ngIf="isSaving" class="material-icons animate-spin text-base">sync</span>
      <span *ngIf="!isSaving" class="material-icons text-base">save</span>
      {{ isSaving ? 'Saving...' : 'Change Password' }}
    </button>
  </form>
</div>
